[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Bridge natural language and deterministic execution through constrained decoding and function calling."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flake8>=7.3.0",
    "mypy>=2.1.0",
    "numpy>=2.5.0",
    "pydantic>=2.13.4",
    "llm-sdk"
]

[dependency-groups]
dev = [
    "pylsp-mypy>=0.8.2",
    "pytest>=9.1.1",
    "python-lsp-server>=1.15.0",
]

[tool.uv.sources]
llm_sdk = {path="./llm_sdk", editable = true}

[tool.pytest.ini_options]
pythonpath = "."
addopts = "-m 'not benchmark'"
markers = [
    "benchmark: performance measurement tests (opt-in via pytest -m benchmark)",
]

# Single source of truth for the mypy gate (`make lint`) AND the opencode LSP
# (pylsp + pylsp-mypy). Previously these flags lived on the Makefile CLI, which
# no language server can read. `mypy_path = "."` lets `from src.*` resolve when
# the LSP runs mypy from the workspace root.
[tool.mypy]
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
mypy_path = "."
# `mypy .` is the subject-mandated command; tests, scripts, and the vendored
# SDK are excluded from the project lint gate.
exclude = [
    "^llm_sdk/",
    "^moulinette/",
    "^tests/",
    "^scripts/",
    "^\\.venv/",
    "^\\.cache/",
    "^\\.hf_cache/",
    "^\\.mypy_cache/",
    "^\\.pytest_cache/",
]

# pylsp-mypy runs mypy through the dmypy daemon for responsiveness. The agent
# always writes files to disk before diagnostics are requested, so live_mode's
# unsaved-buffer support is unnecessary.
[tool.pylsp.plugins.pylsp_mypy]
dmypy = true
report_progress = true

# llm_sdk is a local editable package but is treated as third-party for
# linting purposes: it is excluded from flake8 (src-only) and mypy below.
[[tool.mypy.overrides]]
module = ["llm_sdk", "llm_sdk.*"]
follow_imports = "skip"
ignore_missing_imports = true
